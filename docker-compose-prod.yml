services:
  web:
    build: .
    container_name: codelsior-fr
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      # Config nginx de prod : redirection 301 de l'apex vers www + cache.
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=codelsior.fr,www.codelsior.fr
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=codelsior.fr,www.codelsior.fr
      - LETSENCRYPT_EMAIL=contact@codelsior.fr

networks:
  default:
    name: nginx-proxy
    external: true
