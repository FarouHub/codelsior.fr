# Configuration nginx de production (montée par docker-compose-prod.yml).
# Le dev n'utilise pas ce fichier : docker-compose.yml lance `astro dev`.

# Redirection 301 de l'apex vers le domaine canonique.
# Le scheme est écrit en dur : nginx-proxy termine le TLS et transmet la
# requête en clair, donc $scheme vaudrait toujours "http" ici et
# provoquerait une boucle de redirection.
server {
    listen 80;
    server_name codelsior.fr;

    return 301 https://www.codelsior.fr$request_uri;
}

server {
    listen 80 default_server;
    server_name www.codelsior.fr;
    root /usr/share/nginx/html;
    index index.html;

    # Location relatif sur les redirections internes (/blog -> /blog/).
    # Sans ça, nginx les construit avec $scheme, donc en http:// derrière
    # le proxy TLS : le visiteur serait renvoyé en clair.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ces deux fichiers changent à chaque publication : pas de cache long.
    location ~* ^/(sitemap\.xml|robots\.txt)$ {
        expires 10m;
        add_header Cache-Control "public";
    }

    # SPA-like fallback for clean URLs
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom error page
    error_page 404 /404.html;
}
